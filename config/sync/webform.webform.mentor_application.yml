id: mentor_application
title: 'Mentor Application'
description: '<p>This is the form for people to apply to be a team mentor,</p>'
categories: {  }
elements: |-
  contact_info:
    '#type': webform_contact
    '#title': 'Contact info'
    '#name__required': true
    '#company__help': 'Optional.  Only needed if it is relevant,'
    '#email__description': 'We promise, this is just for us.'
    '#email__required': true
    '#phone__required': true
    '#state_province__title': State
    '#postal_code__title': 'ZIP Code'
    '#country__access': false
  background_check:
    '#type': checkbox
    '#title': 'I am willing to submit to a background check.'
    '#description': '<p>Our charter requires all mentors to submit to a Level 2 background check including fingerprint submission through Sarasota County Schools. &nbsp;In addition to a lesser check through FIRST Robotics. &nbsp;If you are not willing to submit to a check, please do not bother completing this form.</p>'
    '#required': true
  meet_thurs:
    '#type': checkbox
    '#title': 'I am able to meet at the Fab Lab Thursdays 2pm - 5pm. '
    '#description': '<p>During pre-season, Sept - Dec, we only meet one day per week.</p>'
  what_expertise_do_you_have_to_share:
    '#type': textarea
    '#title': 'What expertise do you have to share?'
    '#description': '<p>Please include any relevant experience or education.</p>'
    '#title_display': before
    '#description_display': before
    '#autocomplete': 'off'
  existing_connection:
    '#type': textarea
    '#title': 'Do you have any connection to our members or mentors?'
    '#description': '<p>Let us know if you are a friend, family member or other-wise connected to a team member or mentor.</p>'
    '#title_display': before
    '#description_display': before
