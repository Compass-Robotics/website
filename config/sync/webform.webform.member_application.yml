id: member_application
title: 'Member application'
description: '<p>This is so people can apply to be part of the team.</p>'
categories: {  }
elements: |-
  full_name:
    '#type': textfield
    '#title': 'Full Name'
    '#required': true
  contact_info:
    '#type': fieldset
    '#title': 'Contact Info'
    '#description': '<p>Your contact info will not be shared outside of the team.</p>'
    '#attributes':
      style: 'padding: 1em 0em 1em 0em'
    email_primary:
      '#type': email
      '#title': Email
      '#description': '<p>As a team we rely heavily on Google tools so it helps if you have a Gmail address (not mandatory)</p>'
      '#required': true
      '#required_error': 'An email is essential for us to be able to contact you.'
      '#unique': true
      '#unique_entity': true
      '#unique_error': 'This email address has already been used to apply to be a member of the team.'
    phone_primary:
      '#type': tel
      '#title': Phone
      '#description': '<p>The pattern must match ###-###-####</p>'
      '#autocomplete': 'off'
      '#required': true
      '#required_error': 'A phone number is required.'
      '#pattern': '^\d{3}-\d{3}-\d{4}$'
      '#pattern_error': 'Must follow ###-###-####'
    address:
      '#type': webform_address
      '#title': Address
      '#required': true
      '#address__required': true
      '#city__required': true
      '#state_province__title': State
      '#state_province__placeholder': FL
      '#state_province__help': 'We can only accept members from Florida'
      '#state_province__required': true
      '#state_province__type': textfield
      '#postal_code__title': 'ZIP Code'
      '#postal_code__required': true
      '#country__access': false
    emergency_contact_informarion:
      '#type': textarea
      '#title': 'Emergency Contact Informarion'
      '#description': '<p>Name, email address and phone number of you parent.guardian who should be contact in case of emergency.</p>'
      '#required': true
    discord_username:
      '#type': textfield
      '#title': 'Discord Username'
      '#description': '<p>The team uses Discord for chat, &nbsp;</p>'
  requirements:
    '#type': fieldset
    '#title': Requirements
    '#attributes':
      style: 'padding: 1em 0em'
    can_get_to_fab_lab_to_attend_meetings:
      '#type': checkbox
      '#title': 'I can get to Fab Lab to attend meetings'
      '#required': true
      '#required_error': 'The team requires attendance where we meet.'
    field_can_attend_pre_season:
      '#type': checkbox
      '#title': 'I am able to attend Pre-season team meetings (one per week) Sept - Dec'
      '#required': true
      '#required_error': 'Attendance is required of team members.'
    field_can_attend_build_season:
      '#type': checkbox
      '#title': 'I am able to attend Build Season meetings at least 3 times per week Jan - April '
      '#required': true
      '#required_error': 'Build season is our most critical time.'
    field_can_attend_competitions:
      '#type': checkbox
      '#title': 'I am able to attend a chaperoned trip(s) to regional competition in either Talahassee, Orlando or South Florida. Each competition is a 4 day trip (Wed evening - Sunday night)'
      '#required_error': "Competition is where we shine, and we can't shine if you are not there."
  education:
    '#type': fieldset
    '#title': Education
    '#attributes':
      style: 'padding:1em 0em'
    current_age:
      '#type': number
      '#title': Age
      '#required': true
      '#required_error': 'Age is a required field'
      '#min': 14
      '#max': 18
      '#step': 1
    high_school:
      '#type': webform_term_select
      '#title': 'High School'
      '#description': '<p>The high school you currently attend.</p>'
      '#empty_option': '- select your high school -'
      '#required': true
      '#vocabulary': high_schools
    current_grade:
      '#type': radios
      '#title': 'Current Grade'
      '#options':
        9: '9th (freshman)'
        10: '10th (sophomore)'
        11: '11th (junior)'
        12: '12th (senior)'
      '#required': true
      '#required_error': 'You must be in a high school grade to participate.'
    prior_robotics_experience:
      '#type': checkboxes
      '#title': 'Prior Robotics Experience'
      '#options':
        lego_non_comp: 'Lego robotics (hobby, club or class)'
        fll: 'FIRST Lego League (FLL)'
        ftc: 'FIRST Tech Challenge (FTC)'
        frc: 'FIRST Robotics Challenge (FRC)'
        vex: 'VEX Robotics'
        other: 'Other (explain in notes)'
  field_can_transport_others:
    '#type': checkbox
    '#title': 'I am able to provide transportation to other students at your school to get to the Fab Lab'
  field_parent_interest:
    '#type': checkbox
    '#title': 'Is your parent or guardian interested in becoming a mentor or supporter? '
  interests:
    '#type': fieldset
    '#title': Interests
    field_talents:
      '#type': textarea
      '#title': 'What qualities (skills, passions, interests) do you have that would be helpful to the team?'
      '#required': true
    sections:
      '#type': webform_entity_checkboxes
      '#title': 'What sections of the team interest you?'
      '#required': true
      '#target_type': taxonomy_term
      '#selection_handler': 'default:taxonomy_term'
      '#selection_settings':
        target_bundles:
          sections: sections
        sort:
          field: name
          direction: asc
